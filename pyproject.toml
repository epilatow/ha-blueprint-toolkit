[project]
name = "ha-blueprint-toolkit"
version = "1.0.0"
description = "Home Assistant blueprints backed by a testable HA integration"
requires-python = ">=3.14"
dependencies = [
    "epilatow-repo-shared",
    "pytest",
]

[tool.ha-blueprint-toolkit]
# The lowest Python this repo's code is ever RUN on, as opposed to
# developed against. Two interpreters answer to it and neither is
# this machine's: Home Assistant's own, which imports the integration
# modules and whose floor the ``hacs.json`` release constrains, and
# the Terminal & SSH add-on's, which runs the bundled CLI and the
# host-side installer and which no declaration here can constrain --
# it is whatever ``python3`` the add-on's Alpine base packages.
# ``[tool.ruff] target-version`` is gated against this rather than
# against ``.python-version`` so a newer dev interpreter cannot push
# syntax into the add-on's half of the tree, and
# ``tests/test_analysis_deps.py`` parses that code at this version so
# the floor is exercised rather than merely asserted.
#
# Raising it is a compatibility decision, not a convenience: confirm
# the add-on's current base image packages the new ``python3`` (its
# ``build.yaml`` in home-assistant/addons names the Alpine base) and
# that the ``hacs.json`` floor's Home Assistant releases require at
# least it. Alpine 3.24 is the first base to carry 3.14.
shipped-python-version = "3.14"

[tool.uv.sources]
epilatow-repo-shared = { git = "https://github.com/epilatow/repo-shared", rev = "4d21003fb47bce5dd5c96c96f029e5df64dc9ffe" }

[tool.repo-shared.markdown]
# Repo's pre-existing markdown was wrapped at 78 (markdownlint.json
# pre-onboarding had ``line_length: 78``). Pinned here so the
# shared default 79 doesn't reflow every paragraph in every doc on
# the next repo-shared bump.
wrap = 78

[tool.repo-shared.code-quality]
# Project-wide fallback for files WITHOUT their own PEP 723
# ``# /// script`` block (the integration package modules and
# ``conftest.py``). The delivered ``test_code_quality.py`` runs
# ``mypy --strict`` per file; without this, ``homeassistant.*``,
# ``probatio``, ``yaml``, etc. resolve to ``Any`` and ``--strict``
# then errors on every ``Any`` subclass / untyped decorator.
# ``pytest-homeassistant-custom-component`` (HACC) ships HA core as
# a transitive dependency, so its pin picks which HA API surface
# mypy validates against. Leaving it unpinned would let that
# surface move mid-run, silently invalidating a green result (HA
# does remove APIs between releases -- e.g.
# ``entity_registry.integration_entities``). The pin says what the
# code is validated against, not what users run -- ``hacs.json``
# declares the supported HA floor. ``scripts/hacc_upgrade.py`` owns
# bumping it: don't move the pin by hand. Run weekly by a scheduler,
# it rewrites every pin site to the newest release, runs the suite
# against it, and lands the bump only when that suite passes, so the
# pin follows the newest HACC the suite passes against. The literal
# below is the single source of truth for which version that is --
# never restate it in prose here or in docs, because automation
# moves it and the prose would not follow.
# ``zwave-js-server-python`` is the Z-Wave JS client the ZPM and ZRM
# modules import types from. HA does not install it as a package
# dependency -- its ``zwave_js`` component declares it as a component
# requirement that HA installs at runtime -- so it has to be named
# here for mypy to resolve those imports at all. Its version is not a
# choice: the component declares an EXACT requirement and imports from
# it, so the only client the pinned HA release can be imported against
# is the one that release's ``zwave_js/manifest.json`` names. It
# therefore moves whenever the HACC pin above moves. A ``pip``-style
# resolve will happily install some other version, because the
# component requirement is invisible to it; the failure shows up only
# when a Z-Wave phase imports ``zwave_js`` and a name is missing.
# ``types-PyYAML`` adds the stubs PyYAML itself doesn't ship. It is
# left unpinned on purpose: stubs ship nothing to HA and are
# analysis-only, so every run -- local or CI -- resolves the newest
# typeshed release and "latest" is the only configuration to
# satisfy. The cost is that a typeshed release can turn CI red on an
# unrelated change; the repair is to delete the suppression that has
# gone unused, never to pair it with ``unused-ignore`` -- see
# DEVELOPMENT.md "Analysis-dep pinning and stub suppressions".
mypy-extra-deps = [
    "pytest-homeassistant-custom-component==0.13.375",
    "zwave-js-server-python==0.73.1",
    "types-PyYAML",
]
# The version the integration declares and runs on, which is also
# the only one HACC installs for.
mypy-python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests", "_repo_shared/tests"]
markers = [
    "docker: full-stack docker integration tests (slow, opt-in; run with 'pytest -m docker')",
]
# Exclude docker tests from the default run. tests/run_all.py
# uses tests_dir.glob('test_*.py'), which is non-recursive, so
# it never discovers tests/docker/test_*.py either way.
addopts = "-m 'not docker'"
# pytest-homeassistant-custom-component (used by
# test_hacc_harness.py) provides an async ``hass`` fixture.
# In auto mode pytest-asyncio adopts each test's coroutine
# without requiring per-test @mark.asyncio decoration; this
# is what HA's own integration repos use. No effect on the
# existing sync tests.
asyncio_mode = "auto"

[tool.ruff]
line-length = 80
# Not ``.python-version``. This value decides what the formatter
# EMITS -- at py314 it rewrites multi-type ``except`` clauses into
# the unparenthesized PEP 758 form -- so it has to name the lowest
# interpreter any of this repo's code is run on, not the newest one
# this machine develops against. That floor is
# ``[tool.ha-blueprint-toolkit] shipped-python-version``; raising
# the dev pin alone must
# not move this, or the formatter would put syntax into the bundled
# CLI that the add-on running it cannot parse.
target-version = "py314"
cache-dir = "/tmp/ruff_cache"
extend-exclude = ["_repo_shared"]

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I", "B", "UP", "ARG"]

[tool.ruff.lint.per-file-ignores]
# The mapping parser reports every malformed-input problem as ValueError
# -- wrong types, unknown keys, and out-of-range values alike -- and
# scripts/validate_zwave_mapping_proposal.py catches exactly that to
# report a bad proposal, while the logic tests assert it. Splitting the
# type failures out as TypeError would escape that handler and surface a
# bad mapping file as a traceback. The contract is deliberate and spans
# 14 raises, so the suppression belongs to the file that implements it.
"custom_components/blueprint_toolkit/zwave_parameter_manager/logic.py" = [
    "TRY004",
]
# The mapping verifier is a standalone operator-facing tool: nothing
# catches what it raises, so the exception class is cosmetic and it
# uses ValueError uniformly for malformed input, matching the parser it
# verifies. Suppressed per-file because that choice covers all 8 raises.
"scripts/verify_zwave_mapping.py" = ["TRY004"]

[tool.mypy]
# The version the integration declares and runs on, which is also what
# HACC's HA stubs need to parse (they use ``type X[T] = ...``).
python_version = "3.14"
strict = true
# No ``files = [...]`` set: the canonical type check is the
# delivered ``_repo_shared/tests/test_code_quality.py``,
# which runs ``mypy --strict`` once per discovered file.
# HA-coupled files install
# ``pytest-homeassistant-custom-component`` via their PEP 723
# blocks (project-wide fallback in
# ``[tool.repo-shared.code-quality] mypy-extra-deps``) so
# ``homeassistant.*`` resolves against real types. A bare
# ``uvx mypy`` from a checkout without those deps will not
# resolve those imports; run ``uv run pytest _repo_shared/tests``
# instead.
cache_dir = "/tmp/mypy_cache"
# The bundled CLI (custom_components/.../bundled/bin) and the repo scripts
# (scripts/) are bare modules the test files import off a runtime sys.path
# entry. Putting their dirs on mypy_path lets the resolver find them, so the
# tests type-check against the real modules instead of treating them as Any.
mypy_path = ["custom_components/blueprint_toolkit/bundled/bin", "scripts"]

[[tool.mypy.overrides]]
module = ["homeassistant.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jinja2", "jinja2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# the bundled zwavectl.py CLI bootstraps its own venv for
# these at runtime; the host dev environment may not have them
# installed. The ZRM bridge module imports socketio lazily,
# and the ZRM handler imports socketio.exceptions to classify
# bridge-timeout errors.
module = ["socketio", "socketio.exceptions", "aiohttp"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# zwave-js-server-python is in the fallback deps, so the Z-Wave
# modules type-check against the real package. This override covers
# the targets that carry their own PEP 723 block and omit it -- a
# block replaces the fallback rather than extending it -- so the
# import resolves to Any there instead of erroring.
module = ["zwave_js_server", "zwave_js_server.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# probatio arrives with Home Assistant, which validates
# service-call payloads with it; a checkout analysing a file
# that skips the HA-bearing fallback would not have it.
module = ["probatio"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scripts/dev-install.py imports the integration package
# off a runtime sys.path entry built from the deployed
# build dir; the host dev environment does not have the
# blueprint_toolkit package on its default sys.path.
module = ["blueprint_toolkit", "blueprint_toolkit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pytest-homeassistant-custom-component ships no ``py.typed``
# marker, so ``mypy --strict`` flags every import from it as
# ``[import-untyped]``. The HA-coupled test files import
# ``MockConfigEntry`` / ``ClientSessionGenerator`` from it.
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scripts/ha_ws_fetch.py runs on the HA host against the host's
# system ``websockets``; the dev environment may not have it
# installed, and the import is lazy (inside ``fetch``) so the
# test env can import the module without it.
module = ["websockets", "websockets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The handler test suites monkeypatch helper functions
# (schedule_periodic_with_jitter, validate_and_join_regex_patterns,
# entity_registry, ...) on the handler module -- the standard
# patch-where-used pattern. Without this, ``mypy --strict``'s
# no_implicit_reexport rejects ``handler.<name>`` access from
# the tests.
module = ["custom_components.blueprint_toolkit.*.handler"]
implicit_reexport = true

[dependency-groups]
dev = [
    "mdformat-frontmatter>=2.1.2",
]
